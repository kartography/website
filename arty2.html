<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home Page with Faded Overlay Text</title>
  <style>
    /* Reset and base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    /* Container to center image */
    .container {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* Centered image */
    .center-image {
      top:-30%;

      max-width: 20%;
      max-height: 20%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
    }

    /* Overlay faded words above the image */
    .overlay-text {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 300%;
      font-weight: 600;
      font-family:Arial, Helvetica, sans-serif;
      color: rgb(0, 0, 0);
      opacity: 0.90;
      pointer-events: none;
      user-select: none;
      text-align: center;
      white-space: nowrap;
      z-index: 2; /* above image, below menu */
    }

    /* Menu top right */
    nav {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 3; /* topmost */
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    nav ul li a {
      color: #4674a8;
      text-decoration: none;
      font-weight: 600;
      font-size: 20px;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #ffd700;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      nav ul {
        gap: 15px;
      }
      nav ul li a {
        font-size: 14px;
      }
      .overlay-text {
        font-size: 3.5vw;
        white-space: normal;
        width: 80%;
        font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">ResearchSpace</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <img
      src="images/modern1_upscaled.png"
      alt="Centered Logo"
      class="center-image"
    />
    
    <div class="overlay-text">Dynamic, Interconnected, Transdisciplinary, Collaborative<br><br>
    The Home of ResearchSpace </div>
  </div>
</body>
</html>
