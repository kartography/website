<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Home Page</title>
  <style>
    /* Reset and base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      background-color: #8d9bab; /* nice blue background, you can change */
      font-family: Arial, sans-serif;
      color: #fff;
      background-image: url('images/doomsday.png')
    }

    /* Container to center image */
    .container {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Centered image */
    .center-image {
      max-width: 50%;
      max-height: 50%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Menu top right */
    nav {
      position: absolute;
      top: 20px;
      right: 30px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #ffd700; /* gold highlight on hover */
    }

    /* Responsive: smaller menu spacing on small screens */
    @media (max-width: 480px) {
      nav ul {
        gap: 15px;
      }
      nav ul li a {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

    <img 
      src="images/kartlogokrita.png" 
      alt="Centered Logo" 
      class="center-image"
    />
  </div>
</body>
</html>
